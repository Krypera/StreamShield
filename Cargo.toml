[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/core-capture",
  "crates/core-ocr",
  "crates/core-detect",
  "crates/core-policy",
  "crates/core-redact",
  "crates/core-obs",
  "crates/core-runtime",
  "apps/desktop/src-tauri"
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["StreamShield Contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
